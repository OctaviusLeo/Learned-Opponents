[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learned-opponents"
version = "0.0.0"
description = "Learned Opponents: domain-randomized navigation policies trained in MuJoCo Warp and raced in Unreal (portfolio project)."
requires-python = ">=3.12,<3.13"

# GPU-free core: the spec, randomization, metrics, summary, plotting, and the
# ONNX-fixture half of the parity test run with only these (CI installs the
# same pins from requirements-ci.txt).
dependencies = [
    "numpy==2.5.4",
    "pyyaml==6.0.3",
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "hypothesis==6.170.1",
]
# Training stack chosen by the M0 smoke test (results/smoke_result.json):
# mjlab on MuJoCo Warp with PyTorch and rsl-rl PPO. Exact transitive pins
# are in requirements-gpu.lock (uv pip freeze of ~/.venvs/learned-opponents).
gpu = [
    "mjlab[cu128]==1.6.0",
    "mujoco==3.11.0",
    "mujoco-warp==3.11.0",
    "warp-lang==1.18.0",
    "torch==2.14.1",
    "rsl-rl-lib==5.4.2",
    "tensordict==0.15.1",
    "tensorboard==2.21.0",
]

[tool.setuptools.packages.find]
include = ["learned_opponents*"]

[tool.setuptools.package-data]
"learned_opponents.env" = ["*.xml"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: needs the GPU training stack (mjlab / MuJoCo Warp / torch); CI runs -m 'not gpu'",
]

name: CI

# Runs ruff, the GPU-free pytest suite, and the ONNX parity fixture check on
# every push (all branches) and pull request.
# Training, the GPU environment tests (marked `gpu`), and the Unreal game run
# locally on the RTX 3080 desktop; their results are recorded with command,
# seed, and commit. A failing test fails the job (no `|| true`).

on:
  push:
  pull_request:

# Read-only token; a newer push to the same branch cancels the run it supersedes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Ruff (rules in pyproject.toml)
        run: pipx run --spec ruff==0.17.3 ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install the GPU-free pins and this package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .

      - name: Run pytest (GPU-free tests)
        run: pytest -m "not gpu"

      # pytest samples parity observations; this checks all of them for all six models.
      - name: ONNX parity on every saved fixture (all six committed models)
        run: python -m learned_opponents.export.parity --fixtures-only

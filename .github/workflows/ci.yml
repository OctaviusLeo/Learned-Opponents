name: CI

# Runs the GPU-free pytest suite on every push (all branches) and pull request.
# Training, the GPU environment tests (marked `gpu`), and the Unreal game run
# locally on the RTX 3080 desktop; their results are recorded with command,
# seed, and commit. A failing test fails the job (no `|| true`).

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the GPU-free pins and this package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .

      - name: Run pytest (GPU-free tests)
        run: pytest -m "not gpu"

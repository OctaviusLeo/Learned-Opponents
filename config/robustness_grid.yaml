# Robustness grid (Configured_Values).
# The evaluation sweeps these perturbation values. Each list MUST include at
# least one value OUTSIDE the corresponding training randomization range in
# config/domain_rand.yaml (Requirement 6.1, enforced later by Property 11).
#
# Reference training ranges (from domain_rand.yaml):
#   mass           in [1.5, 2.5]
#   wheel_friction in [0.7, 1.3]
#   latency_steps  in [0, 2]   (action/observation latency)

# mass: includes 1.2 (< 1.5) and 2.8 (> 2.5) which are OUTSIDE [1.5, 2.5].
mass: [1.2, 1.5, 2.0, 2.5, 2.8]

# wheel_friction: includes 0.5 (< 0.7) and 1.5 (> 1.3) which are OUTSIDE [0.7, 1.3].
wheel_friction: [0.5, 0.7, 1.0, 1.3, 1.5]

# latency_steps: includes 4 (> 2) which is OUTSIDE [0, 2].
latency_steps: [0, 1, 2, 4]

episodes_per_cell: 100   # episodes evaluated per grid cell, per variant, per seed

# Robustness grid (Configured_Values). One parameter is varied at a time with
# every other domain parameter at its nominal value; a latency_steps value sets
# both the action and the observation delay queues. Every list includes values
# outside the training randomization range in domain_rand.yaml (Requirement
# 6.1, checked by Property 11). Each cell is evaluated on the same
# eval_episodes layouts from task.yaml's eval_seed.

mass_scale: [0.5, 0.8, 1.0, 1.2, 1.5, 2.0]        # training range [0.8, 1.2]
friction_scale: [0.3, 0.6, 0.9, 1.2, 1.5]         # training range [0.6, 1.2]
latency_steps: [0, 1, 2, 3, 4, 6]                 # training range [0, 2]
episodes_per_cell: 1024                           # per seed; 3072 pooled per variant and cell

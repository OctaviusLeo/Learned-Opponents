# Domain randomization (Configured_Values), sampled at every episode reset for
# the randomized variant; the baseline variant holds every parameter at its
# nominal value. mass, friction, and motor strength are scale factors on the
# nominal values in task.yaml (chassis/wheel mass, wheel friction, motor kv and
# torque limit). Latencies are whole control steps. Frozen after task 8.3.

mass_scale:
  nominal: 1.0
  range: [0.8, 1.2]
friction_scale:
  nominal: 1.0
  range: [0.6, 1.2]
motor_strength_scale:
  nominal: 1.0
  range: [0.8, 1.2]
sensor_noise_sigma_m:        # additive Gaussian noise on ray hit distances, drawn every step
  nominal: 0.0
  range: [0.0, 0.05]
action_latency_steps:        # delay queue on the applied action
  nominal: 0
  range: [0, 2]
observation_latency_steps:   # delay queue on the returned observation
  nominal: 0
  range: [0, 2]

# Domain-randomization configuration (Configured_Values).
# Each parameter has a [min, max] sampling range AND an explicit `nominal`
# value. The RANDOMIZED variant samples uniformly from [min, max]; the
# BASELINE variant uses `nominal` for every parameter (no sampling).
#
# `nominal` is the value used with randomization OFF. It must lie inside the
# [min, max] range and, where it overlaps config/task.yaml, must match that
# file's nominal (e.g. the robot mass used by the task).
#
# Units:
#   mass                      - kg (robot body mass)
#   wheel_friction            - dimensionless friction coefficient
#   motor_strength            - multiplier on nominal motor torque (1.0 = nominal)
#   sensor_noise_sigma        - stddev of additive ray noise, in meters
#   action_latency_steps      - integer steps of delay applied to actions
#   observation_latency_steps - integer steps of delay applied to observations

mass:
  nominal: 2.0
  min: 1.5
  max: 2.5

wheel_friction:
  nominal: 1.0
  min: 0.7
  max: 1.3

motor_strength:
  nominal: 1.0
  min: 0.8
  max: 1.2

sensor_noise_sigma:
  nominal: 0.0
  min: 0.0
  max: 0.05

action_latency_steps:
  nominal: 0
  min: 0
  max: 2

observation_latency_steps:
  nominal: 0
  min: 0
  max: 2

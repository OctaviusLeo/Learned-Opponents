# Training configuration (Configured_Values) for rsl-rl PPO on the MuJoCo Warp
# environment. Both variants use the identical budget and hyperparameters.
# training_budget_steps and the PPO settings are chosen by the baseline pilot
# (seed 100, never reported; task 8.3) and frozen before any reported run.

training_budget_steps: 100000000   # environment (control) steps per run, all worlds summed
num_parallel_envs: 4096            # >= the 4096 worlds proven in the M0 smoke test
max_minutes_per_run: 60
bank_size: 262144                  # pre-sampled episode layouts / domain parameters per run
device: cuda:0

ppo:
  num_steps_per_env: 24            # rollout length per world per iteration
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 1.0e-3
  schedule: adaptive               # KL-adaptive learning rate
  desired_kl: 0.01
  clip_param: 0.2
  entropy_coef: 0.0                # pilot 1 with 0.005: action std diverged (1.0 -> 5.1 in 40M steps) under env-side clipping and deterministic success fell 0.951 -> 0.922 (docs/evidence/pilot/)
  value_loss_coef: 1.0
  max_grad_norm: 1.0
  gamma: 0.99
  lam: 0.95
  use_clipped_value_loss: true

policy:
  hidden_sizes: [256, 256]
  activation: elu
  init_std: 1.0
  obs_normalization: true          # EmpiricalNormalization inside the policy (exported with it)

seeds:
  baseline: [0, 1, 2]
  randomized: [0, 1, 2]
  pilot: [100]                     # budget/hyperparameter pilot only, never reported
